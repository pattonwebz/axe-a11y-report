name: Self-test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: Build, typecheck, and test against fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node tests/self-test.mjs
